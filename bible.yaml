style_lock: >-
  Bright 3D preschool animation, soft rounded shapes, warm saturated colours,
  gentle even lighting, simple friendly character design.

cast:
  coco:
    name: Coco the Bear
    possessive: his          # as written throughout the episode briefs
    features: >-
      A small young bear cub with soft warm golden-brown fur, a lighter cream-coloured
      muzzle and belly patch, small rounded ears, large friendly dark-brown eyes, a small
      black nose, short rounded limbs. Toddler proportions, large head relative to body.
      Wearing a bright red short-sleeved t-shirt with a small yellow star on the chest.
  nana:
    name: Nana Willow
    features: >-
      A gentle elderly owl with soft pale-grey and white feathers, a heart-shaped facial
      disc, large calm amber eyes, small round spectacles on her beak. Rounded,
      unthreatening silhouette. Wearing a soft lavender knitted shawl.
  pip:
    name: Pip the Rabbit
    features: >-
      A small rabbit with soft cream fur, very long floppy ears past the shoulders, a
      round pink nose, large dark friendly eyes, short sturdy hind legs.
      Wearing a blue polka-dot backpack.

locations:
  cottage_night:
    name: Coco's Cottage (night)
    version: 1            # bump DELIBERATELY on a material redesign;
                          # canon belongs to (location_id, version)
    description: >-
      A cosy one-room cottage interior at night: honey-coloured wooden walls, a round
      window showing a deep blue starry sky, a small bed with a patchwork quilt, a small
      wooden chair beside the bed, a woven rug, a low bookshelf. Warm low lamp light.
    geography: >-
      FIXED LAYOUT: round window on the LEFT wall, low bookshelf
      FAR LEFT, bed against the RIGHT wall with its head-end toward the BACK-RIGHT, wooden
      chair beside the bed on its LEFT, woven rug centre floor. Never mirror or flip.
  meadow_day:
    name: Spark Meadow
    version: 1            # bump DELIBERATELY on a material redesign;
                          # canon belongs to (location_id, version)
    description: >-
      An open sunny meadow, short bright green grass, scattered white daisies, one large
      round-topped oak tree on the right, a low wooden fence at the back, rolling hills
      beyond. Bright warm daylight, soft blue sky.
    geography: >-
      FIXED LAYOUT: oak tree RIGHT, wooden fence across the BACK, open grass CENTRE and
      LEFT, hills on the far horizon. Never mirror or flip.

# Per-mode direction. Learned constraints live here, not in episode files.
# Closed vocabularies. The planner SELECTS from these; it never invents wording.
# The validator compares these enums, so continuity decisions are deterministic.
# `material: true` dimensions may not change across a cut — the transition must be
# shown inside a shot.
state_vocab:
  awareness:
    material: true
    values: [AWAKE, DROWSY, EYES_CLOSED, ASLEEP]
  posture:
    material: true
    values: [LYING_FLAT, LYING_SIDE, SITTING_UP, STANDING, PERCHED, WALKING, BOUNCING]
  facing:
    material: false
    values: [LEFT, RIGHT, CAMERA, AWAY, UP, DOWN]
  zone:
    material: true
    values: [BED, CHAIR, RUG, WINDOW, DOOR, SHELF, MEADOW_CENTRE, MEADOW_TREE]
  expression:
    material: false
    values: [NEUTRAL, HAPPY, CALM, CURIOUS, SLEEPY, SURPRISED]

# Per-shot visual state. Not per-character. A CONTINUOUS edit may legitimately change
# composition (wide -> close) while every material state stays identical, so these are
# tracked separately and gate predecessor-pixel inheritance.
visual_vocab:
  shot_size:    [WIDE, MEDIUM_WIDE, MEDIUM, CLOSE, EXTREME_CLOSE]
  camera_angle: [EYE_LEVEL, HIGH, LOW, OVER_SHOULDER]

# The planner declares narrative INTENT (coverage_role). Deterministic code assigns the
# camera. Coverage arithmetic — "at least one WIDE and one CLOSE across N shots" — is
# mechanical once intent is known, and Gemini demonstrably cannot satisfy it even with
# an enum and an explicit repair prompt.
coverage_roles: [ESTABLISH, GROUP, SUBJECT, REACTION, DETAIL, RESOLUTION]
focus_types:    [CHARACTER, GROUP, PROP, ENVIRONMENT]

# Generic visual constraints. NOT provider-specific negatives — the prompt compiler
# translates these per provider. A magical story can allow sparkles; a realistic
# educational scene forbids them. Learned from the P01 probe, where Veo added floating
# luminous particles present in no prompt, bible entry or location description.
visual_constraints:
  ambient_effects:    NONE      # NONE | SUBTLE | ALLOWED
  background_entities: NONE     # no unspecified people, animals or props
  text_overlay:       NONE
  weather_effects:    NONE

modes:
  BEDTIME_STORY:
    visual_constraints: {ambient_effects: NONE, background_entities: NONE}
    coverage:                             # role -> preferred size, then acceptable ones
      ESTABLISH:  [MEDIUM_WIDE, WIDE]
      GROUP:      [MEDIUM_WIDE, MEDIUM]
      SUBJECT:    [MEDIUM, MEDIUM_WIDE]
      REACTION:   [MEDIUM, CLOSE]
      DETAIL:     [CLOSE]
      RESOLUTION: [MEDIUM_WIDE, MEDIUM]
    allowed_boundaries: [CONTINUOUS]      # a bedtime scene is one unbroken moment
    pacing: slow, calm, gentle throughout; narration-led
    camera_allowed: [STATIC, SLOW_PUSH_IN, SLOW_PULL_BACK, GENTLE_PAN]
    camera_avoid: [whip pan, fast orbit, handheld shake, rapid zoom]
    rules: >-
      Hold a single locked camera for the whole scene unless a change is dramatically
      motivated. No peril, no surprises, no loud events. End with the child asleep.
  SONG:
    coverage:
      ESTABLISH:  [WIDE]
      GROUP:      [WIDE, MEDIUM_WIDE]
      SUBJECT:    [MEDIUM, CLOSE]
      REACTION:   [CLOSE, MEDIUM]
      DETAIL:     [CLOSE, EXTREME_CLOSE]
      RESOLUTION: [WIDE, MEDIUM_WIDE]
    allowed_boundaries: [CONTINUOUS, TIME_JUMP, MONTAGE, LOCATION_CHANGE]
    pacing: rhythmic and energetic, cut on musical phrases
    camera_allowed: [STATIC, SLOW_PUSH_IN, GENTLE_PAN, GENTLE_TRACK]
    camera_avoid: [handheld shake, rapid zoom]
    rules: Repeat the chorus. Keep actions simple and repeatable.
  STORY:
    coverage:
      ESTABLISH:  [WIDE, MEDIUM_WIDE]
      GROUP:      [MEDIUM_WIDE, WIDE]
      SUBJECT:    [MEDIUM]
      REACTION:   [CLOSE, MEDIUM]
      DETAIL:     [CLOSE]
      RESOLUTION: [MEDIUM_WIDE, WIDE]
    allowed_boundaries: [CONTINUOUS, TIME_JUMP, LOCATION_CHANGE]
    pacing: narrative and action driven
    camera_allowed: [STATIC, SLOW_PUSH_IN, SLOW_PULL_BACK, GENTLE_PAN, GENTLE_TRACK]
    camera_avoid: [handheld shake]
    rules: One dominant action per shot. Kindness and good habits.

# Deterministic English for the typed vocabulary. The compiled SHOT line is rendered from
# these, so the generator receives clean prose while the pipeline keeps enums as the only
# source of truth. New vocabulary gets a phrase here rather than a code change; anything
# missing falls back to its lowercased label, so an omission reads badly but never breaks.
phrasing:
  posture:
    LYING_FLAT: lies on {pos} back
    LYING_SIDE: lies on {pos} side
    SITTING_UP: sits up
    STANDING: stands
    PERCHED: is perched
    WALKING: is walking
    BOUNCING: is bouncing
  awareness:
    AWAKE: awake
    DROWSY: drowsy
    EYES_CLOSED: with {pos} eyes closed
    ASLEEP: asleep
  zone:
    BED: in the bed
    CHAIR: on the chair
    RUG: on the rug
    WINDOW: by the window
    DOOR: by the door
    SHELF: by the bookshelf
    MEADOW_CENTRE: in the middle of the meadow
    MEADOW_TREE: by the oak tree
  facing:
    LEFT: facing left
    RIGHT: facing right
    CAMERA: facing the camera
    AWAY: facing away
    UP: looking up
    DOWN: looking down
  expression:
    NEUTRAL: with a neutral expression
    HAPPY: looking happy
    CALM: looking calm
    CURIOUS: looking curious
    SLEEPY: looking sleepy
    SURPRISED: looking surprised

# An expression that merely restates the awareness adds nothing and reads badly
# ("asleep, looking sleepy"). Suppression is data, not a special case in code.
phrasing_suppress:
  - when: {awareness: ASLEEP}
    omit: [expression]
  - when: {awareness: EYES_CLOSED}
    omit: [expression]

# What each shot size MEANS as composition, one canonical template per value of
# visual_vocab.shot_size. Without this, CLOSE and MEDIUM_WIDE differ by two words in the
# compiled prompt and we are simply assuming the generator reads those labels the way we
# do. Composition intent is the camera compiler's job, so it states it rather than hoping.
# Destination state only -- nothing here may describe a move.
framing:
  shot_size:
    WIDE: the whole space and the spatial relationships within it are clearly established, subject small in frame
    MEDIUM_WIDE: the subject plus a substantial amount of the surrounding space is visible
    MEDIUM: the subject occupies the centre of the frame with some surrounding space visible
    CLOSE: the subject dominates the frame, with only a little of the background visible
    EXTREME_CLOSE: a single detail fills the frame
  camera_angle:
    EYE_LEVEL: viewed level with the subject
    HIGH: viewed from slightly above, looking down
    LOW: viewed from slightly below, looking up
    OVER_SHOULDER: viewed past the shoulder of another character in the foreground

# The objects that PERSIST in a place across every shot filmed there, named explicitly so
# a plate candidate can be judged object by object instead of by overall impression.
# Attempt 001 for cottage_night looked right at a glance and had invented a different rug
# and a different chair from the twelve accepted seconds; "it looks like the room" is not
# a probe.
#
# Deliberately NOT nested inside `locations`. This list is judgement data, not generation
# data -- it reaches no prompt and cannot change a pixel, and `locations` is hashed into
# every frame's identity. Putting it there would invalidate accepted paid frames for a
# change that could not have altered them.
persistent_objects:
  cottage_night: [walls, round window, bed, patchwork quilt, wooden chair, woven rug, low bookshelf, floor]
  meadow_day: [grass, daisies, oak tree, wooden fence, hills, sky]

# Environmental PROPERTIES of a place, which are not objects and must never be listed as
# ones. Attempt 002 is the evidence: "lamp light" sat in persistent_objects, the compiled
# prompt therefore asked the model to preserve the design, materials, shape and
# proportions of the lighting, and it obliged by inventing a physical lantern on the floor
# where accepted footage shows only a warm glow with no fixture in frame. An intangible
# property described as an object gets drawn as one.
#
# `source_visible: false` states that the thing producing the light is NOT in frame in the
# accepted footage, which is a fact about the world worth carrying rather than rediscovering.
environment:
  cottage_night:
    lighting: warm low lamp light, pooling on the wall behind the bed
    source_visible: false
  meadow_day:
    lighting: bright warm daylight from a high sun
    source_visible: false

# The AUDIO SPINE, per mode. A bed is authored for the whole episode and laid under
# finished picture; the video provider's per-clip audio is discarded. Measured on E01:
# three independently generated clips landed 13.4 LU apart, so provider audio can never
# be a continuous soundtrack, whatever its quality.
#
# Notes are named, not hertz — a chord written as frequencies is a chord nobody can read
# or change. ORIGINAL composition, deliberately: licensed music is a copyright claim
# waiting to happen on a channel whose whole defence is that it is original work.
audio_bed:
  BEDTIME_STORY:
    character: warm, slow, almost still — a held lullaby chord that never resolves
    chord: [C3, G3, E4, B4]
    swell_seconds: 9        # one very slow breath in and out, longer than any shot
    tone_gain: 0.11         # quiet: this sits UNDER narration, it is not the subject
    air_gain: 0.010         # a faint hiss of room air so the bed is not a dead sine
  STORY:
    character: gentle and open, a little brighter than bedtime
    chord: [C3, G3, C4, E4]
    swell_seconds: 7
    tone_gain: 0.13
    air_gain: 0.012
  SONG:
    character: bright and simple, a bed a melody can sit on top of
    chord: [C3, G3, C4, G4]
    swell_seconds: 5
    tone_gain: 0.15
    air_gain: 0.010

# WHAT MUST VISIBLY CHANGE in a beat — declared by the planner as SEMANTIC INTENT, never as
# a choice of renderer. The planner says what the audience must see change; code decides
# the cheapest proven way to make that happen. That division is the rule this project has
# been built on since the first prompt compiler, and it applies to money as much as to
# pixels: without it a planner picks generative video because it sounds richer.
#
# Justified by measurement, not taste. Generated clips of this room are not rigid — E01/s01
# and s04 hold at 11% tile agreement even with the pervasive particles suppressed — and a
# generated second costs Rs 8, which is Rs 555 per published minute.
visual_change:
  NONE:                  nothing changes; the image is held
  CAMERA_ONLY:           only the viewpoint moves — a push in, a drift, a reveal
  CHARACTER_DEFORMATION: a character's body or face changes shape — sitting to lying, a smile, a blink
  CHARACTER_TRANSLATION: a character moves through the space
  OBJECT_DEFORMATION:    a thing in the world changes shape or state
  WORLD_CHANGE:          the place itself changes — light, weather, time

# Which renderer can satisfy which requirement, cheapest first. A renderer is listed here
# only when it has been DEMONSTRATED to do the thing, not when it plausibly could.
renderers:
  STILL_HOLD:
    satisfies: [NONE]
    cost: FREE
    evidence: E01's closing hold, built and watched
  PROGRAMMED_CAMERA:
    satisfies: [NONE, CAMERA_ONLY]
    cost: FREE
    evidence: deterministic ffmpeg transform of an accepted still; no provider involved
  GENERATIVE_VIDEO:
    satisfies: [NONE, CAMERA_ONLY, CHARACTER_DEFORMATION, CHARACTER_TRANSLATION,
                OBJECT_DEFORMATION, WORLD_CHANGE]
    cost: PAID
    evidence: E01/s02 sitting to lying, and s03 holding a sleep state, both accepted
    caution: >-
      environmental rigidity is NOT among the things this renderer has demonstrated. The
      two widest generated clips in the archive are the two unstable ones. Prefer a
      deterministic renderer for beats whose content is the WORLD rather than a character.

# DETERMINISTIC CAMERA MOVES for beats that no generator needs to touch. Offline ffmpeg
# arithmetic over an accepted still: free, repeatable, and — unlike a generated clip — the
# room provably cannot reshape itself, because nothing is regenerating it.
#
# Written as intent plus magnitude, so a mode can be gentle and a different mode brisk
# without a second implementation.
camera_moves:
  HOLD:        {kind: NONE,  amount: 0.0,  says: the image is held, perfectly still}
  PUSH_IN:     {kind: ZOOM,  amount: 6.0,  says: the camera moves slowly toward the subject}
  PULL_BACK:   {kind: ZOOM,  amount: -6.0, says: the camera eases slowly away}
  DRIFT_LEFT:  {kind: PAN_X, amount: -4.0, says: the frame drifts gently to the left}
  DRIFT_RIGHT: {kind: PAN_X, amount: 4.0,  says: the frame drifts gently to the right}
  RISE:        {kind: PAN_Y, amount: -3.0, says: the frame lifts gently upward}
