id: E01
mode: BEDTIME_STORY
title: Coco's Starlight Bedtime
location: cottage_night
cast: [coco]
shots: 3
idea: >-
  A complete, calm bedtime moment, told in one unbroken stretch of time in Coco's room.

  Beat 1 is an ESTABLISH beat: a wide view of the whole room, Coco sitting up in bed under
  the patchwork quilt, awake, looking out at the stars through the round window.

  Beats 2 and 3 are both DETAIL beats, held at the same intimate framing on Coco and never
  cutting back out. In beat 2 he grows sleepy, lies down onto his side with his head on the
  pillow and lets his eyes close. In beat 3 he is already asleep and simply stays asleep,
  breathing gently, the quilt rising and falling. Beat 3 changes nothing about him: he
  starts it exactly as beat 2 left him.

  Nobody else is in the room at any point, nobody enters or leaves, and nothing is picked
  up, put down or moved. The only thing that changes is Coco himself, and every change must
  be shown happening on screen rather than between shots.
requirements:
  - id: framing_change_across_a_continuous_cut
    type: CAMERA_VARIATION
    strength: MUST
    params: {required_sizes: [WIDE, CLOSE]}
