name: 1 · frames

on: workflow_dispatch

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: python make.py portraits && python make.py frames
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - name: commit frames for review
        run: |
          git config user.name  "coco-spark bot"
          git config user.email "noreply@github.com"
          git add -f out/portraits out/frames out/ledger.json
          git diff --cached --quiet || git commit -m "frames: $(date -u +%FT%TZ)"
          git push
