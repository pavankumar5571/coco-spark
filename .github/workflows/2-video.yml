name: 2 · video  (run only after reviewing frames)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: mkdir -p out/approved && cp out/frames/*.png out/approved/
      - run: python make.py video && python make.py assemble
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            out/episode.mp4
            out/ledger.json
